<svg width="900" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
<!-- 定義漸變色 -->
<defs>
  <linearGradient id="lightBlue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:rgba(164, 194, 244, 0.8);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(201, 218, 248, 0.8);stop-opacity:1" />
  </linearGradient>
  <linearGradient id="mediumBlue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:rgba(109, 158, 235, 0.75);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(138, 180, 248, 0.75);stop-opacity:1" />
  </linearGradient>
  <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:rgba(61, 133, 198, 0.75);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(91, 155, 213, 0.75);stop-opacity:1" />
  </linearGradient>
  <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:rgba(249, 203, 156, 0.8);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(252, 229, 205, 0.8);stop-opacity:1" />
  </linearGradient>
</defs>

<!-- 整體位置調整，縮短上下留空距離 -->
<g transform="translate(50, 15)">
  <!-- 底層菱形（橘色） -->
  <polygon points="400,350 250,270 400,190 550,270" fill="url(#orange)" stroke="#0b5394" stroke-width="2" />
  
  <!-- 中層菱形 -->
  <polygon points="400,270 250,190 400,110 550,190" fill="url(#mediumBlue)" stroke="#0b5394" stroke-width="2" />
  
  <!-- 頂層菱形 -->
  <polygon points="400,190 250,110 400,30 550,110" fill="url(#lightBlue)" stroke="#0b5394" stroke-width="2" />
  
  <!-- 節點 -->
  <!-- 底層節點 -->
  <circle cx="400" cy="350" r="5" fill="#0b5394" />
  <circle cx="250" cy="270" r="5" fill="#0b5394" />
  <circle cx="400" cy="190" r="5" fill="#0b5394" />
  <circle cx="550" cy="270" r="5" fill="#0b5394" />
  <circle cx="325" cy="310" r="5" fill="#0b5394" />
  <circle cx="475" cy="310" r="5" fill="#0b5394" />
  <circle cx="325" cy="230" r="5" fill="#0b5394" />
  <circle cx="475" cy="230" r="5" fill="#0b5394" />
  
  <!-- 中層節點 -->
  <circle cx="250" cy="190" r="5" fill="#0b5394" />
  <circle cx="400" cy="110" r="5" fill="#0b5394" />
  <circle cx="550" cy="190" r="5" fill="#0b5394" />
  <circle cx="325" cy="150" r="5" fill="#0b5394" />
  <circle cx="475" cy="150" r="5" fill="#0b5394" />
  <circle cx="400" cy="270" r="5" fill="#0b5394" />
  <circle cx="325" cy="230" r="5" fill="#0b5394" />
  <circle cx="475" cy="230" r="5" fill="#0b5394" />
  
  <!-- 頂層節點 -->
  <circle cx="250" cy="110" r="5" fill="#0b5394" />
  <circle cx="400" cy="30" r="5" fill="#0b5394" />
  <circle cx="550" cy="110" r="5" fill="#0b5394" />
  <circle cx="325" cy="70" r="5" fill="#0b5394" />
  <circle cx="475" cy="70" r="5" fill="#0b5394" />
  <circle cx="325" cy="150" r="5" fill="#0b5394" />
  <circle cx="475" cy="150" r="5" fill="#0b5394" />
  <circle cx="400" cy="190" r="5" fill="#0b5394" />
  
  <!-- 左側文字 -->
  <text x="0" y="190" font-family="Arial" font-size="24" font-weight="bold" text-anchor="start" fill="#0b5394">EdgeSync</text>
  <text x="0" y="220" font-family="Arial" font-size="24" font-weight="bold" text-anchor="start" fill="#0b5394">Containerization</text>
  <text x="0" y="240" font-family="Arial" font-size="14" fill="#666666" text-anchor="start">
    <tspan x="10" dy="5">Chips Container Pass-through</tspan>
    <tspan x="10" dy="25">Supporting Qualcomm/NXP/NVIDIA</tspan>
    <tspan x="10" dy="25">Advantech Container Catalog</tspan>
  </text>
  
  <!-- 右上文字 -->
  <text x="560" y="85" font-family="Arial" font-size="24" font-weight="bold" fill="#0b5394" text-anchor="start">EdgeSync API</text>
  <text x="570" y="110" font-family="Arial" font-size="14" fill="#666666" text-anchor="start">
    <tspan x="570" dy="0">Device Management</tspan>
    <tspan x="570" dy="25">Supporting Monitoring, OTA</tspan>
  </text>
  
  <!-- 右下文字 -->
  <text x="560" y="260" font-family="Arial" font-size="24" font-weight="bold" fill="#0b5394" text-anchor="start">EdgeSync Device Library</text>
  <text x="560" y="280" font-family="Arial" font-size="14" fill="#666666" text-anchor="start">
    <tspan x="570" dy="0">Device Control</tspan>
    <tspan x="570" dy="25">Supporting C#/Python</tspan>
  </text>
</g>
</svg>