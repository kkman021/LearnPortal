<svg width="100%" height="100%" viewBox="0 0 500 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!-- Device Box (with solid border) -->
  <rect x="160" y="80" width="220" height="140" rx="5" ry="5" stroke="#4CAF50" stroke-width="3" stroke-dasharray="0,0" fill="rgba(76, 175, 80, 0.1)"/>
  <rect x="160" y="80" width="220" height="30" rx="5" ry="5" stroke="#4CAF50" stroke-width="0" fill="#4CAF50"/>
  <text x="180" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="white">Device</text>
  
  <!-- Main SDK Box -->
  <rect x="100" y="150" width="140" height="120" rx="5" ry="5" stroke="#2196F3" stroke-width="3" stroke-dasharray="5,0" fill="rgba(33, 150, 243, 0.1)"/>
  <rect x="100" y="150" width="140" height="30" rx="5" ry="5" stroke="#2196F3" stroke-width="0" fill="#2196F3"/>
  <text x="120" y="170" font-family="Arial" font-size="14" font-weight="bold" fill="white">EdgeSync SDK</text>
  
  <!-- GPIO Control in Device Box - with BLACK text -->
  <rect x="250" y="120" width="120" height="25" rx="3" ry="3" stroke="#4CAF50" stroke-width="1" fill="rgba(76, 175, 80, 0.2)"/>
  <text x="310" y="137" font-family="Arial" font-size="11" fill="black" text-anchor="middle">GPIO Control</text>
  
  <!-- Device Info in Device Box - with BLACK text -->
  <rect x="250" y="155" width="120" height="25" rx="3" ry="3" stroke="#4CAF50" stroke-width="1" fill="rgba(76, 175, 80, 0.2)"/>
  <text x="310" y="172" font-family="Arial" font-size="11" fill="black" text-anchor="middle">Device Information</text>
  
  <!-- Language Logos Vertical Arrangement -->
  <!-- C# Logo -->
  <circle cx="170" cy="195" r="15" fill="#9B4F96"/>
  <text x="170" y="199" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">C#</text>
  
  <!-- Go Logo -->
  <circle cx="170" cy="225" r="15" fill="#00ADD8"/>
  <text x="170" y="229" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Go</text>
  
  <!-- Python Logo -->
  <circle cx="170" cy="255" r="15" fill="#3776AB"/>
  <text x="170" y="259" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Py</text>
</svg>