openapi: 3.0.4
info:
  title: EdgeHub RESTful API
  description: |
    EdgeHub provides a RESTful API interface allowing users to access the following:
    - User authentication
    - Groups
    - Machines (objects)
    - Parameters
    - Real-time or historical parameter data
  version: "2.0"

servers:
  - url: https://api-hub-deviceon-bi-{namespace}-{cluster}.{hostname}
    description: Base URL for the EdgeHub API
    variables:
      namespace:
        default: master
        description: Namespace name
      cluster:
        default: ensaas
        description: Cluster name
      hostname:
        default: edge365.advantech.com
        description: Hostname

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: IFPTenant
      description: Tenant ID specifying which tenant to access

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: SSO user account in email format
          example: sa.jing@advantech.com.cn
        password:
          type: string
          description: SSO user password
          example: abcdefg
        setCookie:
          type: boolean
          description: Optional. If set to true, the cookie will be written to the browser
          example: true

    LoginResponse:
      type: object
      properties:
        latency:
          type: string
          description: API query latency in milliseconds
          example: "81ms"
        data:
          type: object
          properties:
            tokenType:
              type: string
              description: Token type, currently only supports "Bearer"
              example: Bearer
            accessToken:
              type: string
              description: API access token to include in the Authorization header for subsequent requests
              example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9...
            expiresIn:
              type: integer
              description: Token expiration time as a Unix timestamp; token is valid for 1 hour
              example: 1688024303
            refreshToken:
              type: string
              description: A Base64‐encoded string used to refresh the token
              example: 8b684897-1647-11ee-88bd-0a580adf40db
            user:
              type: object
              properties:
                tenants:
                  type: array
                  description: Tenant information for the logged-in user
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Tenant ID; include this in the header for data-related API requests
                        example: VGVuYW50.ZDet-2iqhavNUEAg
                      name:
                        type: string
                        description: Tenant name
                        example: satest

    RefreshTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: A Base64‐encoded string obtained from the "refreshToken" field of the login API
          example: 20df5ce0-165e-11ee-88bd-0a580adf40db

    RefreshTokenResponse:
      type: object
      properties:
        latency:
          type: string
          description: API query latency in milliseconds
          example: "9ms"
        data:
          type: object
          properties:
            tokenType:
              type: string
              description: Token type, currently only supports "Bearer"
              example: Bearer
            accessToken:
              type: string
              description: API access token to include in the Authorization header for subsequent requests
              example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9...
            expiresIn:
              type: integer
              description: Token expiration time as a Unix timestamp; token is valid for 1 hour
              example: 1688034051
            refreshToken:
              type: string
              description: A Base64‐encoded string used to refresh the token
              example: 3da6e1ff-165e-11ee-88bd-0a580adf40db

    SetMyTenantRequest:
      type: object
      required:
        - tenantId
      properties:
        tenantId:
          type: string
          description: Tenant ID obtained from the login API
          example: VGVuYW50.ZCI4Q928Cafk07SD

    Group:
      type: object
      properties:
        id:
          type: string
          description: Group ID
          example: R3JvdXA.MTEyMg
        _id:
          type: integer
          description: Group ID (internal use)
          example: 1122
        parentId:
          type: string
          description: Parent group ID
          example: null
        _parentId:
          type: integer
          description: Parent group ID (internal use)
          example: null
        tenantId:
          type: string
          description: Tenant ID
          example: VGVuYW50.ZWb-tfKRKUpOavef
        sourceName:
          type: string
          description: Group name used as the key in the database
          example: PM Test
        owner:
          type: string
          description: Tenant owner's account in email format
          example: tracy.su@advantech.com.tw
        timeZone:
          type: string
          description: Time zone
          example: Asia
        timeZoneInfo:
          type: object
          properties:
            label:
              type: string
              example: (GMT+08:00) Asia
            timeZone:
              type: string
              example: Asia
            utcOffset:
              type: integer
              example: 480
        depth:
          type: integer
          description: Depth
          example: 1
        coordinate:
          type: object
          properties:
            longitude:
              type: string
              example: "0.0000000000"
            latitude:
              type: string
              example: "0.0000000000"
        createdAt:
          type: string
          format: date-time
          example: "2023-11-29T09:04:54.089Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-29T09:04:54.089Z"
        name:
          type: array
          description: Multilingual group name
          items:
            type: object
            properties:
              lang:
                type: string
                example: en-US
              text:
                type: string
                example: PM Test
        description:
          type: array
          description: Multilingual group description
          items:
            type: object
            properties:
              lang:
                type: string
                example: en-US
              text:
                type: string
                example: PM Test
        descendants:
          type: array
          description: Descendant group objects with the same structure as this object
          items:
            $ref: '#/components/schemas/Group'

    Machine:
      type: object
      properties:
        id:
          type: string
          description: Machine ID
          example: TWFjaGluZQ.MjkwNTI
        _id:
          type: integer
          description: Machine ID (internal use)
          example: 29052
        groupId:
          type: string
          description: Group ID
          example: R3JvdXA.MTEyMg
        _groupId:
          type: integer
          description: Group ID (internal use)
          example: 1122
        tenantId:
          type: string
          description: Tenant ID
          example: VGVuYW50.ZWb-tfKRKUpOavef
        sourceName:
          type: string
          description: Machine name
          example: Obj01
        createdAt:
          type: string
          format: date-time
          example: "2023-12-01T02:25:49.294Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-12-01T02:25:49.254Z"
        machineType:
          type: object
          properties:
            parentKey:
              type: string
              example: default
            key:
              type: string
              example: DefaultEquipType
        name:
          type: array
          description: Multilingual machine name
          items:
            type: object
            properties:
              lang:
                type: string
                example: en-US
              text:
                type: string
                example: Obj01
        description:
          type: array
          description: Multilingual machine description
          items:
            type: object
            properties:
              lang:
                type: string
                example: en-US
              text:
                type: string
                example: ""

    Parameter:
      type: object
      properties:
        id:
          type: string
          description: Parameter ID
          example: UGFyYW1ldGVy.MjkwNTImQ29uMDE
        _id:
          type: string
          description: Parameter ID (internal use)
          example: 29052&Con01
        machineId:
          type: string
          description: Machine ID
          example: TWFjaGluZQ.MjkwNTI
        _machineId:
          type: integer
          description: Machine ID (internal use)
          example: 29052
        name:
          type: string
          description: Parameter name
          example: Con01
        valueType:
          type: string
          description: Value type
          example: Number
        kind:
          type: string
          description: Kind
          example: Constant
        defaultValue:
          type: string
          description: Default value
          example: "0"
        unit:
          type: string
          description: Unit
          example: ""
        spanHi:
          type: integer
          description: Upper limit
          example: 100
        spanLo:
          type: integer
          description: Lower limit
          example: 0
        recordingType:
          type: string
          description: Recording type
          example: Current
        createdAt:
          type: string
          format: date-time
          example: "2023-12-01T02:26:24.086Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-12-01T02:26:23.983Z"
        cursor:
          type: string
          example: UGFyYW1ldGVy.MjkwNTImQ29uMDE
        description:
          type: array
          description: Multilingual parameter description
          items:
            type: object
            properties:
              lang:
                type: string
                example: en-US
              text:
                type: string
                example: ""

    OriginalCalculatedDataRequest:
      type: object
      required:
        - id
        - startTime
        - endTime
        - precise
      properties:
        id:
          type: string
          description: Parameter ID
          example: UGFyYW1ldGVy.MTY2NCZDYWxBY2M
        startTime:
          type: integer
          description: Start time as a Unix timestamp in milliseconds
          example: 1701990000000
        endTime:
          type: integer
          description: End time as a Unix timestamp in milliseconds
          example: 1701993600000
        precise:
          type: string
          description: Precision level. Only supports minute, hour, day, month, year
          example: hour
        mongoUpsertBlob:
          type: boolean
          description: Whether to use MongoDB to upsert BLOB

    OriginalCalculatedDataResponse:
      type: object
      properties:
        datapoints:
          type: array
          description: Data array
          items:
            type: array
            items:
              type: number
        fieldList:
          type: array
          description: Field list
          items:
            type: string
            example: [maxvalue, minvalue, lastvalue, avgvalue, datatime, quality]

    OriginalRawDataRequest:
      type: object
      required:
        - id
        - startTime
        - endTime
      properties:
        id:
          type: string
          description: Parameter ID
          example: UGFyYW1ldGVy.MTY2NCZDYWxBY2M
        startTime:
          type: integer
          description: Start time as a Unix timestamp in milliseconds
          example: 1701993590000
        endTime:
          type: integer
          description: End time as a Unix timestamp in milliseconds
          example: 1701993600000
        onlyMongo:
          type: boolean
          description: Whether to use only MongoDB
        mongoUpsertBlob:
          type: boolean
          description: Whether to use MongoDB to upsert BLOB

    OriginalRawDataResponse:
      type: object
      properties:
        datapoints:
          type: array
          description: Data array
          items:
            type: array
            items:
              type: number
        fieldList:
          type: array
          description: Field list
          items:
            type: string
            example: [datavalue, quality, datatime]

    SetParameterDataRequest:
      type: object
      properties:
        paramValue:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Parameter ID
                example: UGFyYW1ldGVy.MSZTSU0wMDE
              value:
                oneOf:
                  - type: number
                  - type: string
                description: Parameter value, depending on data type
                example: 100
              type:
                type: integer
                description: Type (1=analog, 2=discrete, 3=text)
                example: 1

    SetParameterDataResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: OK
        latency:
          type: string
          example: 200 ms

paths:
  /v2/auth/login:
    post:
      summary: Login
      description: Login using SSO credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /v2/auth/refreshToken:
    post:
      summary: Refresh token
      description: Get a new access token using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

  /v2/auth/setMyTenant:
    post:
      summary: Set my tenant
      description: Set the tenant for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMyTenantRequest'
      responses:
        '200':
          description: Successful

  /v2/auth/logout:
    post:
      summary: Logout
      description: Logout the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful

  /v2/groups:
    get:
      summary: Get groups
      description: Retrieve all groups
      security:
        - bearerAuth: []
        - tenantHeader: []
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  latency:
                    type: string
                    example: 28ms
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          $ref: '#/components/schemas/Group'

  /v2/machines/{groupId}:
    get:
      summary: Get machines in group
      description: Retrieve all machines (objects) in the specified group
      security:
        - bearerAuth: []
        - tenantHeader: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
          description: Group ID, which can be obtained from the Get Groups API
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  latency:
                    type: string
                    example: 18ms
                  data:
                    type: object
                    properties:
                      machines:
                        type: array
                        items:
                          $ref: '#/components/schemas/Machine'

  /v2/parameters/{machineId}:
    get:
      summary: Get parameters of the machine
      description: Retrieve all parameters of the specified machine
      security:
        - bearerAuth: []
        - tenantHeader: []
      parameters:
        - name: machineId
          in: path
          required: true
          schema:
            type: string
          description: Machine ID, which can be obtained from the Get Machines API
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  latency:
                    type: string
                    example: 9ms
                  data:
                    type: object
                    properties:
                      parameters:
                        type: array
                        items:
                          $ref: '#/components/schemas/Parameter'

  /v2/parameter/HIS/original/calculatedData:
    get:
      summary: Get original calculated parameter data
      description: Retrieve the original calculated data of a parameter
      security:
        - bearerAuth: []
        - tenantHeader: []
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginalCalculatedDataResponse'

  /v2/parameter/HIS/original/rawData:
    get:
      summary: Get original raw parameter data
      description: Retrieve the original raw data of a parameter
      security:
        - bearerAuth: []
        - tenantHeader: []
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginalRawDataResponse'

  /v2/parameter/HIS/{method}/data:
    get:
      summary: Get auto-scaled parameter data
      description: Retrieve auto-scaled or fixed-scaled parameter data
      security:
        - bearerAuth: []
        - tenantHeader: []
      parameters:
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum: [autoScale, fixedScale]
          description: Method, only supports autoScale or fixedScale
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Parameter ID
        - name: startTime
          in: query
          required: true
          schema:
            type: integer
          description: Start time as a Unix timestamp in milliseconds
        - name: endTime
          in: query
          required: true
          schema:
            type: integer
          description: End time as a Unix timestamp in milliseconds
        - name: dataType
          in: query
          required: true
          schema:
            type: string
            enum: [max, min, avg, last]
          description: Data type, only supports max, min, avg, last
        - name: maxPoints
          in: query
          required: true
          schema:
            type: integer
          description: Maximum number of points
        - name: interval
          in: query
          required: true
          schema:
            type: string
            enum: [sec, min, hour, day, month, year]
          description: Interval, supports sec, min, hour, day, month, year
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  datapoints:
                    type: array
                    description: Data array [value, quality, data timestamp]
                    items:
                      type: array
                      items:
                        type: number
                  interval:
                    type: integer
                    description: Time interval in milliseconds
                  nextData:
                    type: array
                    description: Single next data point
                    items:
                      type: number
                  previousData:
                    type: array
                    description: Single previous data point
                    items:
                      type: number

  /v2/parameter/RT/data:
    get:
      summary: Get the latest parameter data
      description: Retrieve the latest data of a parameter
      security:
        - bearerAuth: []
        - tenantHeader: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: Array of parameter IDs
        - name: before
          in: query
          schema:
            type: integer
          description: Data before this timestamp (in seconds)
        - name: after
          in: query
          schema:
            type: integer
          description: Data after this timestamp (in seconds)
        - name: includeBefore
          in: query
          schema:
            type: boolean
          description: Whether to include data at the 'before' timestamp
        - name: includeAfter
          in: query
          schema:
            type: boolean
          description: Whether to include data at the 'after' timestamp
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      datapoints:
                        type: array
                        items:
                          type: object
                          properties:
                            quailty:
                              type: integer
                              example: 0
                            timestamp:
                              type: integer
                              example: 1708596913001
                            value:
                              oneOf:
                                - type: number
                                - type: string
                              example: 292301
                  latency:
                    type: string
                    example: 5.479707ms

    post:
      summary: Set parameter data
      description: Set the data for parameters
      security:
        - bearerAuth: []
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetParameterDataRequest'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetParameterDataResponse'

  /v2/parameter/statistic/discrete/{op}:
    get:
      summary: Get statistical data of parameter (discrete data type)
      description: Retrieve statistical data for discrete-type parameters
      security:
        - bearerAuth: []
        - tenantHeader: []
      parameters:
        - name: op
          in: path
          required: true
          schema:
            type: string
            enum: [sum]
          description: Operation, only supports sum
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Parameter ID
        - name: startTime
          in: query
          required: true
          schema:
            type: integer
          description: Start time as a Unix timestamp in milliseconds
        - name: endTime
          in: query
          required: true
          schema:
            type: integer
          description: End time as a Unix timestamp in milliseconds
        - name: status
          in: query
          required: true
          schema:
            type: integer
          description: Discrete status value
        - name: precise
          in: query
          required: true
          schema:
            type: string
            enum: [min, hour, day, month, year]
          description: Precision level, supports min, hour, day, month, year
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of occurrences of the status
                    example: 183
                  duration:
                    type: integer
                    description: Duration of the status in seconds
                    example: 1830

  /v2/parameter/statistic/analog/{op}:
    get:
      summary: Get statistical data of parameter (analog data type)
      description: Retrieve statistical data for analog-type parameters
      security:
        - bearerAuth: []
        - tenantHeader: []
      parameters:
        - name: op
          in: path
          required: true
          schema:
            type: string
            enum: [avg, sum]
          description: Operation, supports avg and sum
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Parameter ID
        - name: startTime
          in: query
          required: true
          schema:
            type: integer
          description: Start time as a Unix timestamp in milliseconds
        - name: endTime
          in: query
          required: true
          schema:
            type: integer
          description: End time as a Unix timestamp in milliseconds
        - name: precise
          in: query
          required: true
          schema:
            type: string
            enum: [min, hour, day, month, year]
          description: Precision level, supports min, hour, day, month, year
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    description: Statistical value
                    example: 16190.5

security:
  - bearerAuth: []
  - tenantHeader: []