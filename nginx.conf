server {
    listen       80;
    server_name  localhost;

    # 建議：Strict-Transport-Security 僅設於 HTTPS server 區塊
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdn-cookieyes.com https://www.google.com https://googleads.g.doubleclick.net https://analytics.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://cdn-cookieyes.com https://*.google.com https://*.google.com.tw https://googleads.g.doubleclick.net https://analytics.google.com https://raw.githubusercontent.com https://docs.wise-paas.advantech.com;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://*.cookieyes.com https://cdn-cookieyes.com https://www.google.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://analytics.google.com https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://ssl.gstatic.com https://google.com https://*.google.com https://stats.g.doubleclick.net;
      frame-ancestors 'none';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      frame-src https://www.googletagmanager.com https://tagmanager.google.com https://cdn-cookieyes.com https://www.google.com https://googleads.g.doubleclick.net https://td.doubleclick.net https://analytics.google.com https://www.youtube.com;
    " always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html =404;
    }
}
